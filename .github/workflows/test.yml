name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mirrors .forgejo/workflows/test.yml so the same CI lights up if
# this repo is ever mirrored to a GitHub host. Forgejo is the
# canonical CI; the GitHub copy is best-effort.

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/drift-check.sh

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ""
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18, 19]
        # `layout` selects turbovec 1.0.0's blocked-codes scoring kernel.
        # turbovec picks it at runtime by CPU feature
        # (avx512vnni && avx512vbmi -> the vector-major permute-dot
        # kernel; otherwise the classic LUT kernel). The two kernels'
        # 4-bit quantized scores differ enough to flip a near-tie, so a
        # host that only ever runs ONE kernel can pass while the other
        # returns a different top-k (this shipped as 3 CI failures the
        # VNNI-only EC2 qual missed; fixed by knn()'s exact-cosine
        # rerank). We now exercise BOTH kernels deterministically via
        # turbovec's `TURBOVEC_NO_VECTOR_MAJOR` env var so the coverage
        # does not depend on the runner's CPU. `classic` forces the LUT
        # kernel; `native` uses whatever the runner supports. The full
        # pg matrix runs `native`; `classic` runs on the reference
        # pg16 only (the divergence is kernel-specific, not pg-specific)
        # to keep CI cost bounded. See docs/CI.md and docs/TESTING.md.
        layout: [native]
        include:
          - pg: 16
            layout: classic
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clone; the test matrix doesn't need tag history
          # the way drift-check does. Reduces rate-limit pressure on
          # repos with lots of history (`actions/checkout@v4` retries
          # internally but a deep clone amplifies each 403).
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Don't deny warnings; the gburd/turbovec fork carries
          # pre-existing upstream warnings we don't own.
          rustflags: ""

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libssl-dev libreadline-dev zlib1g-dev \
              libicu-dev libxml2-dev libxslt1-dev liblz4-dev libzstd-dev \
              libclang-dev clang \
              flex bison \
              libopenblas-dev gfortran

      - name: install cargo-pgrx
        run: cargo install --locked cargo-pgrx --version 0.19.1

      - uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-pg${{ matrix.pg }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg${{ matrix.pg }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo pgrx init --pg${{ matrix.pg }} download

      # NOTE: GitHub `ubuntu-latest` runners are AVX2-capable, and
      # turbovec selects its SIMD kernel with a *runtime*
      # `is_x86_feature_detected!` check. So this job always exercises
      # the AVX2 path, never the pre-AVX2 scalar fallback. The
      # scalar fallback (which once shipped a silent wrong-results /
      # duplicate-TID bug) is covered ONLY by turbovec's own upstream
      # `x86_scalar_fallback_tests::scalar_fallback_matches_simd_topk`
      # plus validating turbovec git-rev bumps on a pre-AVX2 host or
      # `qemu-x86_64 -cpu Nehalem`. Compile-time `-C
      # target-feature=-avx2` would NOT force the scalar path at
      # runtime on an AVX2 machine, so we deliberately do not add a
      # job that pretends to. See docs/TESTING.md § (b) and docs/CI.md.
      # The `index_am_recall_floor_{2,3,4}bit` tests run inside the
      # matrix below and guard the scale + distinct-ids gaps that let
      # that bug ship.
      # `layout` (matrix): `classic` forces turbovec's classic-LUT
      # scoring kernel via TURBOVEC_NO_VECTOR_MAJOR=1; `native` leaves
      # it at "0" (turbovec treats any value != "0" as "force classic",
      # so "0" == use whatever the runner's CPU supports). This runs the
      # #[pg_test] suite under BOTH kernels so a near-tie flip between
      # them can't pass on one host and fail on another (the v2.0.0 KNN
      # regression). `cargo pgrx test` inherits this env into the
      # postgres backend it spawns, so the kernel selection propagates.
      - name: cargo pgrx test (${{ matrix.layout }} kernel)
        env:
          TURBOVEC_NO_VECTOR_MAJOR: ${{ matrix.layout == 'classic' && '1' || '0' }}
        run: |
          cargo pgrx test pg${{ matrix.pg }} \
              --no-default-features \
              --features "pg${{ matrix.pg }} pg_test"
