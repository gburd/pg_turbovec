# VS_BENCH_PLAN § B.10 — identical for every arm
listen_addresses = ''
unix_socket_directories = '/tmp'
port = 5432
shared_buffers = 128GB
huge_pages = on
effective_cache_size = 600GB
work_mem = 256MB
maintenance_work_mem = 64GB
max_worker_processes = 128
max_parallel_workers = 96
max_parallel_maintenance_workers = 32
max_parallel_workers_per_gather = 0
io_method = io_uring
effective_io_concurrency = 64
jit = off
max_connections = 300
wal_level = replica
fsync = on
synchronous_commit = on
checkpoint_timeout = 30min
max_wal_size = 64GB
autovacuum = off
track_io_timing = on
compute_query_id = on
shared_preload_libraries = 'pg_prewarm,pg_stat_statements'
logging_collector = on
log_directory = 'log'
log_line_prefix = '%m [%p] '
