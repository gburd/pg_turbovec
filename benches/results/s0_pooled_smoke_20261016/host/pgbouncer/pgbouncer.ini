;; PgBouncer config generated by setup_pooler.sh — transaction pooling.
[databases]
turbovec_pooled = host=localhost port=28818 dbname=turbovec_pooled

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = trust
auth_file = /home/admin/s0/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 3
max_client_conn = 5000
server_lifetime = 600
server_idle_timeout = 120
; pass search_path through so turbovec operators resolve (transaction mode
; drops SET, so we also rely on schema-qualified SQL in run_load.sh).
ignore_startup_parameters = extra_float_digits,options,search_path
pidfile = /home/admin/s0/pgbouncer/pgbouncer.pid
logfile = /home/admin/s0/pgbouncer/pgbouncer.log
admin_users = admin
stats_users = admin
; expose pool stats on the admin console (psql -p PORT pgbouncer)
